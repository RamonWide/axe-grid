name: Feature request
description: Something Axe-Grid should be able to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](https://github.com/RamonWide/axe-grid/blob/main/ROADMAP.md) first:
        if the feature is already listed, add a thumbs-up to its issue or tell us why it matters to you.
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Describe the task, not only the button. "When I build a preset I want to..."
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: On the unit's front panel, in another editor, or not at all.
  - type: checkboxes
    id: blocker
    attributes:
      label: How much does it matter?
      options:
        - label: This is what stops me from using Axe-Grid
