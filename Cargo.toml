[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
authors = ["The Axe-Grid contributors"]
repository = "https://github.com/RamonWide/axe-grid"
homepage = "https://github.com/RamonWide/axe-grid"
readme = "README.md"
keywords = ["axe-fx", "midi", "sysex", "guitar", "editor"]
categories = ["multimedia::audio"]
# Not on crates.io yet; remove this line in the release that publishes.
publish = false

# Small, fast release binaries for the downloads.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
axegrid-sysex = { path = "crates/axegrid-sysex" }
axegrid-model = { path = "crates/axegrid-model" }
axegrid-device = { path = "crates/axegrid-device" }
axegrid-engine = { path = "crates/axegrid-engine" }
axegrid-automation = { path = "crates/axegrid-automation" }
axegrid-ui-egui = { path = "crates/axegrid-ui-egui" }
serde_json = "1"
getrandom = "0.4"
eframe = "0.36"
egui = "0.36"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
